openapi: 3.1.0
info:
  title: Yuxi 外部 Agent 调用 API
  version: 1.0.0
paths:
  /api/agent:
    get:
      operationId: listVisibleAgentsForExternalIntegration
      summary: 查询当前身份可见的 Agent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 可见 Agent 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/chat/thread:
    post:
      operationId: createExternalIntegrationThread
      summary: 为外部调用创建会话线程
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadCreate"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 用户或 Agent 不存在，或当前身份不可访问 Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/thread/{thread_id}/history:
    get:
      operationId: getExternalIntegrationThreadHistory
      summary: 查询会话消息历史
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: 会话消息历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadHistoryResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 会话不存在或不属于当前身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/thread/{thread_id}/attachments:
    post:
      operationId: uploadExternalIntegrationThreadAttachment
      summary: 上传并关联一个线程附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 单个附件，最大 5 MB
      responses:
        "200":
          description: 附件已保存，并尽可能转换为 Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "400":
          description: 文件名无效或文件超过 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 会话不存在或不属于当前身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listExternalIntegrationThreadAttachments
      summary: 查询线程附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: 线程附件和上传限制
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentListResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 会话不存在或不属于当前身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/thread/{thread_id}/attachments/{file_id}:
    delete:
      operationId: deleteExternalIntegrationThreadAttachment
      summary: 删除线程附件
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 附件已删除
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 会话或附件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/chat/image/upload:
    post:
      operationId: uploadExternalIntegrationImage
      summary: 上传并处理多模态图片
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG、PNG、WebP、GIF 或 BMP，入口最大 10 MB
      responses:
        "200":
          description: 图片方向修正、压缩和缩略图生成结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          description: 文件不是图片、超过 10 MB 或图片处理失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: 图片处理发生未预期错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/agent-invocation/agent-call/runs:
    post:
      operationId: createExternalAgentCallRun
      summary: 创建同步或异步 Agent 调用
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCallRunCreate"
      responses:
        "200":
          description: Agent 调用响应；异步模式下可能仍为非终态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCallResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Agent 不存在或当前身份不可见
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: request_id 冲突、线程绑定冲突或线程已有活跃运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 请求字段或消息内容无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: 同步等待超时，run 可能仍在执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/agent-invocation/agent-call/runs/result:
    post:
      operationId: getExternalAgentCallRunResult
      summary: 查询 Agent 调用结果
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCallRunResultRequest"
      responses:
        "200":
          description: 当前运行结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCallResponse"
        "400":
          $ref: "#/components/responses/UserConfigurationInvalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: run 不存在或不属于当前身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: run_id 与 agent_slug 不匹配
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: run_id 为空或请求字段无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "使用 `Authorization: Bearer yxkey_...`"
  responses:
    UserConfigurationInvalid:
      description: API Key 绑定用户缺少部门等必要配置
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 缺少凭据或 API Key 无效、已禁用、已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ThreadCreate:
      type: object
      required:
        - agent_id
      properties:
        title:
          type:
            - string
            - "null"
        agent_id:
          type: string
          description: 实际值为 Agent slug
        metadata:
          type:
            - object
            - "null"
          additionalProperties: true
    ThreadResponse:
      type: object
      required:
        - id
        - uid
        - agent_id
        - is_pinned
        - created_at
        - updated_at
        - metadata
      properties:
        id:
          type: string
          description: 后续接口使用的 thread_id
        uid:
          type: string
        agent_id:
          type: string
          description: 会话绑定的 Agent slug
        title:
          type:
            - string
            - "null"
        is_pinned:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
        metadata:
          type: object
          additionalProperties: true
    AttachmentResponse:
      type: object
      required:
        - file_id
        - file_name
        - file_size
        - status
        - uploaded_at
        - path
      properties:
        file_id:
          type: string
        file_name:
          type: string
        file_type:
          type:
            - string
            - "null"
        file_size:
          type: integer
          minimum: 0
          maximum: 5242880
        status:
          type: string
          description: parsed 表示存在 Markdown 副本；uploaded 表示只保存原文件
        uploaded_at:
          type: string
        path:
          type: string
        artifact_url:
          type:
            - string
            - "null"
        original_path:
          type:
            - string
            - "null"
        original_artifact_url:
          type:
            - string
            - "null"
        minio_url:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
    AttachmentListResponse:
      type: object
      required:
        - attachments
        - limits
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentResponse"
        limits:
          type: object
          required:
            - allowed_extensions
            - max_size_bytes
          properties:
            allowed_extensions:
              type: array
              items:
                type: string
            max_size_bytes:
              type: integer
              const: 5242880
    ImageUploadResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        image_content:
          type:
            - string
            - "null"
          description: 处理后主图的纯 Base64，不包含 data URL 前缀
        thumbnail_content:
          type:
            - string
            - "null"
        width:
          type:
            - integer
            - "null"
        height:
          type:
            - integer
            - "null"
        format:
          type:
            - string
            - "null"
        mime_type:
          type:
            - string
            - "null"
        size_bytes:
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
    ThreadHistoryResponse:
      type: object
      required:
        - history
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/ThreadHistoryMessage"
    ThreadHistoryMessage:
      type: object
      required:
        - id
        - type
        - content
      properties:
        id:
          type: integer
        type:
          type: string
          description: human、ai、tool 或 system
        content:
          type: string
        created_at:
          type:
            - string
            - "null"
        run_id:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
        delivery_status:
          type:
            - string
            - "null"
        error_type:
          type:
            - string
            - "null"
        error_message:
          type:
            - string
            - "null"
        extra_metadata:
          type: object
          additionalProperties: true
        message_type:
          type:
            - string
            - "null"
        image_content:
          type:
            - string
            - "null"
        feedback:
          type:
            - object
            - "null"
          additionalProperties: true
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: true
    AgentListResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentSummary"
    AgentSummary:
      type: object
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        is_default:
          type: boolean
        is_subagent:
          type: boolean
      additionalProperties: true
    AgentCallRunCreate:
      type: object
      required:
        - agent_slug
        - messages
      properties:
        agent_slug:
          type: string
          description: 目标 Agent slug；去除首尾空白后不得为空
        messages:
          type: array
          minItems: 1
          description: 从后向前选取最后一条 user 消息作为输入
          items:
            $ref: "#/components/schemas/InputMessage"
        stream:
          type: boolean
          default: false
          description: 当前只支持 false
        agent_call_meta:
          type: object
          default: {}
          description: 调用方元数据；不允许包含 context
          additionalProperties: true
        thread_id:
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
          maxLength: 64
        model_spec:
          type:
            - string
            - "null"
        async_mode:
          type: boolean
          default: false
    InputMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
        content:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                oneOf:
                  - $ref: "#/components/schemas/TextContentPart"
                  - $ref: "#/components/schemas/ImageContentPart"
      additionalProperties: true
    TextContentPart:
      type: object
      required:
        - type
        - text
      properties:
        type:
          const: text
        text:
          type: string
    ImageContentPart:
      type: object
      required:
        - type
        - image_url
      properties:
        type:
          const: image_url
        image_url:
          oneOf:
            - type: string
            - type: object
              required:
                - url
              properties:
                url:
                  type: string
                detail:
                  type: string
              additionalProperties: true
    AgentCallRunResultRequest:
      type: object
      required:
        - run_id
      properties:
        run_id:
          type: string
        agent_slug:
          type:
            - string
            - "null"
    AgentCallResponse:
      type: object
      required:
        - run_id
        - agent_slug
        - thread_id
        - status
        - request_id
        - output
        - choices
        - usage
      properties:
        run_id:
          type:
            - string
            - "null"
        agent_slug:
          type:
            - string
            - "null"
        thread_id:
          type:
            - string
            - "null"
        status:
          type: string
        request_id:
          type:
            - string
            - "null"
        output:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/AgentCallChoice"
        usage:
          $ref: "#/components/schemas/TokenUsage"
        error:
          $ref: "#/components/schemas/RunError"
    AgentCallChoice:
      type: object
      required:
        - index
        - messages
        - finish_reason
      properties:
        index:
          type: integer
        messages:
          type: array
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
              content:
                type: string
        finish_reason:
          type:
            - string
            - "null"
    TokenUsage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    RunError:
      type: object
      properties:
        type:
          type:
            - string
            - "null"
        message:
          type:
            - string
            - "null"
      additionalProperties: true
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail: {}
